<div class="chat-message" [class.self]="message().user.id === currentUserId()">
  <div class="message-header">
    <span class="sender">{{ message().user.name }}</span>
    <!-- <span class="timestamp">{{ message.timestamp | date:'shortTime' }}</span> -->
  </div>
  <div class="message-body">
    {{ message().text }}
  </div>
</div>
<style>
  .chat-message {
    padding: 10px;
    margin: 5px;
    border-radius: 8px;
    max-width: 60%;
  }
  .chat-message.self {
    background-color: #dcf8c6;
    align-self: flex-end;
  }
  .chat-message:not(.self) {
    background-color: #ffffff;
    align-self: flex-start;
  }
  .message-header {
    font-size: 0.8em;
    color: #555;
    margin-bottom: 5px;
  }
  .message-body {
    font-size: 1em;
  }
</style>
