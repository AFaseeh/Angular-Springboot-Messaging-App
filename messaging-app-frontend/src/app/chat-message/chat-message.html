<div class="chat-message">

<div class="message-wrapper" 
    [class.is-me]="message().user.id === currentUserId()" 
    [class.is-other]="message().user.id !== currentUserId()">
    
    <p-card header="{{ message().user.name }}">
      <p>
          {{ message().text }}
      </p>
  </p-card>
</div>
