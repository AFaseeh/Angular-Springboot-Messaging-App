<form (ngSubmit)="onSubmit()">
  <div>
    <label for="UserName">Enter UserName: </label>
    <input type="text" id="UserName" name="UserName" [(ngModel)]="UserName" />
  </div>
  <div>
    <label for="Password">Enter Password: </label>
    <input
      type="password"
      id="Password"
      name="Password"
      [(ngModel)]="Password"
    />
  </div>
  <button type="submit">Send</button>
  <button (click)="SwitchToRegister()">Register Instead</button>
</form>
@if (Error()) {
  <p style="color: red">Error in {{ Error()!.field }}: {{ Error()!.message }}</p>
}
