<form #loginForm="ngForm" (ngSubmit)="onSubmit()" class="flex-col form-container">

  <div class="input-wrapper">
    <p-floatLabel variant="on" class="w-full">
      <input pInputText type="text" class="w-full" id="UserName" name="UserName" [(ngModel)]="UserName"
      #userName="ngModel"
      [invalid]="userName.invalid && (userName.touched || loginForm.submitted)" 
      required />
      <label for="UserName">Username</label>
    </p-floatLabel>
    @if (userName.invalid && (userName.touched || loginForm.submitted)) {
      <app-form-error message="Username is required." />
    }
  </div>

  <div class="input-wrapper">
    <p-floatLabel variant="on" class="w-full">
      <p-password
        #passwordModel="ngModel"
        [inputStyle]="{'width':'100%'}"
        styleClass="w-full"
        inputId="Password"
        name="Password"
        [(ngModel)]="Password"
        [feedback]="false"
        [invalid]="passwordModel.invalid && (passwordModel.touched || loginForm.submitted)"
        [toggleMask]="true"
        required
      />
      <label for="Password">Password</label>
    </p-floatLabel>
    @if (passwordModel.invalid && (passwordModel.touched || loginForm.submitted))
    {
      <app-form-error message="Password is required." />
    }
  </div>

  <div class="flex-row">
    <p-button type="submit" label="Log In" [loading]="loading()" styleClass="flex-1"/>
    <p-button type="button" label="Register Instead" (onClick)="SwitchToRegister()" styleClass="flex-1"/>
  </div>
</form>
